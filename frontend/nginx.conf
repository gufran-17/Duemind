# /etc/nginx/conf.d/default.conf  (inside your frontend Docker image)

server {
    listen 80;
    server_name _;

    # Serve React/static frontend
    root /usr/share/nginx/html;
    index index.html;

    # All frontend routes — SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend
    # NOTE: In host network mode, use 127.0.0.1 — NOT localhost, NOT backend
    location /api/ {
        proxy_pass         http://127.0.0.1:5000/api/;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Prevent nginx from doing its own DNS lookup at startup
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}